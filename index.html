<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匹克球公平排場</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,"Noto Sans TC",sans-serif; }
  body { background:#f0f4f8; color:#1a2b3c; padding:16px; max-width:720px; margin:0 auto; }
  h1 { font-size:1.4rem; text-align:center; margin-bottom:4px; }
  .sub { text-align:center; color:#667; font-size:.85rem; margin-bottom:16px; }
  .card { background:#fff; border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 2px 6px rgba(0,0,0,.08); }
  label { display:block; font-weight:600; margin:10px 0 4px; font-size:.9rem; }
  textarea, input, select { width:100%; padding:10px; border:1px solid #ccd; border-radius:8px; font-size:1rem; }
  button { padding:12px; margin-top:10px; border:none; border-radius:10px; background:#0a7d4f; color:#fff; font-size:1rem; font-weight:700; cursor:pointer; }
  button.gray { background:#5b6b7b; }
  button.red { background:#b23b3b; }
  button.blue { background:#1e6091; }
  .full { width:100%; }
  .court { border-left:6px solid #0a7d4f; }
  .court h3 { font-size:1rem; color:#0a7d4f; margin-bottom:8px; }
  .team { display:flex; justify-content:space-between; align-items:center; padding:5px 0; font-size:1.05rem; }
  .vs { text-align:center; color:#b23b3b; font-weight:700; margin:4px 0; font-size:.9rem; }
  .score-input-row { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:10px; padding-top:8px; border-top:1px dashed #e2e8f0; }
  .score-input-row input { width:65px; text-align:center; font-size:1.1rem; padding:6px; font-weight:bold; }
  .resting { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .tag { background:#e8eef4; padding:4px 10px; border-radius:20px; font-size:.85rem; }
  .rating-tag { font-size:.75rem; color:#0a7d4f; background:#e3f5ec; padding:2px 6px; border-radius:10px; margin-left:4px; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { padding:6px 8px; text-align:center; border-bottom:1px solid #e5eaf0; }
  th { background:#f5f8fb; }
  #qrbox { display:flex; justify-content:center; padding:10px; }
  .round { text-align:center; font-size:1.15rem; font-weight:700; margin-bottom:10px; }
  .btnrow { display:flex; gap:10px; margin-top:6px; } .btnrow button { flex:1; }
  .xbtn { background:none; color:#b23b3b; font-weight:700; padding:2px 6px; margin:0; font-size:.9rem; cursor:pointer; }
  .hint { font-size:.8rem; color:#789; text-align:center; margin-top:6px; }
  .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center; padding:16px; z-index:999; }
  .modal-content { background:#fff; border-radius:12px; padding:20px; width:100%; max-width:500px; max-height:85vh; overflow-y:auto; }
</style>
</head>
<body>

<!-- ===== 設定頁 ===== -->
<div id="setup">
  <h1>匹克球公平排場</h1>
  <div class="sub">輸入人數與場地 · DUPR 分數整合 · 匯出 DUPR CSV</div>
  <div class="card">
    <label>球員名單（每行一位，可填「名字, DUPR分數」或只填名字）</label>
    <textarea id="names" rows="7" placeholder="王小明, 3.52&#10;李小華, 3.20&#10;John&#10;Mary, 4.01"></textarea>
    <div class="hint" style="text-align:left; margin-bottom:10px;">💡 若無 DUPR 分數可直接留空，例如僅輸入名字。</div>

    <label>場地數量</label>
    <select id="courts">
      <option value="1">1 面</option><option value="2" selected>2 面</option>
      <option value="3">3 面</option><option value="4">4 面</option>
      <option value="5">5 面</option><option value="6">6 面</option>
    </select>
    <button class="full" onclick="start()">開始排場</button>
  </div>
</div>

<!-- ===== 主持人畫面 ===== -->
<div id="game" style="display:none">
  <h1>匹克球公平排場</h1>
  <div class="sub" id="headerInfo"></div>
  <div class="round" id="roundTitle"></div>
  
  <div id="courtList"></div>

  <div class="card"><h3>本輪休息</h3><div class="resting" id="restList"></div></div>

  <div class="card">
    <button class="full" onclick="promptRoundScoresAndNext()">結束本輪（輸入分數並排下一輪）</button>
    <div class="btnrow">
      <button class="gray" onclick="showQR()">顯示本輪 QR Code</button>
      <button class="gray" onclick="copyLink()">複製本輪連結</button>
    </div>
    <div id="qrbox"></div>
    <div class="hint">QR 每輪更新：重新安排後，請大家再掃一次</div>
  </div>

  <div class="card">
    <div style="display:flex; gap:8px;">
      <input id="newName" placeholder="球員名字（例：陳小東）" style="flex:2;">
      <input id="newDupr" placeholder="DUPR (選填)" type="number" step="0.01" style="flex:1;">
    </div>
    <button class="gray full" onclick="addPlayer()">加入球員（下一輪生效）</button>
  </div>

  <div class="card">
    <h3 style="margin-bottom:8px">公平統計（按 ✕ 可讓球員離場）</h3>
    <table id="statsTable"></table>
    
    <button class="blue full" onclick="exportDUPRCSV()">匯出對戰結果 (DUPR CSV)</button>
    <button class="red full" onclick="resetAll()">全部重來</button>
  </div>
</div>

<!-- ===== 分數輸入 Modal ===== -->
<div id="scoreModal" class="modal-overlay">
  <div class="modal-content">
    <h2 style="font-size:1.2rem; margin-bottom:12px; text-align:center;">輸入第 <span id="mRoundNum"></span> 輪比分</h2>
    <div id="modalScores"></div>
    <div class="btnrow">
      <button class="gray" onclick="closeScoreModal()">取消</button>
      <button onclick="confirmRoundScores()">儲存並進入下一輪</button>
    </div>
  </div>
</div>

<!-- ===== 掃描者唯讀畫面 ===== -->
<div id="viewer" style="display:none">
  <h1>本輪對戰</h1>
  <div class="sub" id="vTitle"></div>
  <div id="vCourts"></div>
  <div class="card"><h3>休息中</h3><div class="resting" id="vRest"></div></div>
  <div class="hint">由主持人裝置更新；要看最新一輪請再掃一次 QR Code</div>
  <div class="card"><button class="gray full" onclick="location.hash='';location.reload()">回到大廳</button></div>
</div>

<script>
let state = null;
const $ = id => document.getElementById(id);

/* ---------- 公平演算法 ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function nextRound(){
  const pool = shuffle([...state.players]).sort((a,b)=> a.played-b.played || a.lastPlayed-b.lastPlayed);
  const slots = state.courts * 4;
  const playing = pool.slice(0, Math.min(slots, pool.length));
  const resting = pool.slice(playing.length);

  const assignment = [];
  for(let c=0; c<state.courts && c*4+4<=playing.length; c++){
    const t = shuffle(playing.slice(c*4, c*4+4));
    assignment.push({ 
      courtIndex: c + 1,
      a: [t[0].name, t([dupr.zendesk.com](https://dupr.zendesk.com/hc/en-us/articles/45778582901140-Adding-Matches-via-CSV)).name], 
      b: [t([reddit.com](https://www.reddit.com/r/Pickleball/comments/11mb7is/dupr_events_inputting_match_results_is_tedious?tl=zh-hant)).name, t([help.courtreserve.com](http://help.courtreserve.com/en/articles/8955787-add-league-match-information-into-dupr)).name],
      scoreA: '',
      scoreB: ''
    });
  }
  state.round++;
  state.assignment = { assignment, resting: resting.map(p=>p.name) };
  playing.forEach(p=>{ p.played++; p.lastPlayed = state.round; });
  save(); render();
}

/* ---------- 分數與 DUPR 匯出邏輯 ---------- */
function promptRoundScoresAndNext(){
  $('mRoundNum').textContent = state.round;
  const list = $('modalScores');
  list.innerHTML = state.assignment.assignment.map((c, i) => `
    <div style="margin-bottom:12px; padding:10px; background:#f9fafb; border-radius:8px;">
      <div style="font-weight:bold; font-size:.9rem; margin-bottom:4px;">場地 ${i+1}</div>
      <div style="font-size:.85rem; color:#555;">隊伍 A: ${c.a.join(' & ')}</div>
      <div style="font-size:.85rem; color:#555; margin-bottom:6px;">隊伍 B: ${c.b.join(' & ')}</div>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="number" id="mScoreA_${i}" value="${c.scoreA !== undefined ? c.scoreA : ''}" placeholder="A 分數" min="0">
        <span>:</span>
        <input type="number" id="mScoreB_${i}" value="${c.scoreB !== undefined ? c.scoreB : ''}" placeholder="B 分數" min="0">
      </div>
    </div>
  `).join('');
  $('scoreModal').style.display = 'flex';
}

function closeScoreModal(){
  $('scoreModal').style.display = 'none';
}

function confirmRoundScores(){
  // 記錄分數至歷史 matches
  if(!state.matches) state.matches = [];
  const today = new Date().toISOString().split('T')[0];

  state.assignment.assignment.forEach((c, i) => {
    const sa = $(`mScoreA_${i}`).value;
    const sb = $(`mScoreB_${i}`).value;
    c.scoreA = sa !== '' ? parseInt(sa) : 0;
    c.scoreB = sb !== '' ? parseInt(sb) : 0;

    state.matches.push({
      date: today,
      round: state.round,
      court: i + 1,
      team1: [...c.a],
      team2: [...c.b],
      score1: c.scoreA,
      score2: c.scoreB
    });
  });

  closeScoreModal();
  nextRound();
}

function exportDUPRCSV(){
  if(!state.matches || state.matches.length === 0){
    alert('尚未有完成的對戰比分紀錄！請先進行比賽並於結束本輪時輸入比分。');
    return;
  }

  // DUPR 官方標準匯入欄位格式
  const headers = [
    "Match Date",
    "Player 1 First Name", "Player 1 Last Name", "Player 1 Email", "Player 1 DUPR ID",
    "Player 2 First Name", "Player 2 Last Name", "Player 2 Email", "Player 2 DUPR ID",
    "Player 3 First Name", "Player 3 Last Name", "Player 3 Email", "Player 3 DUPR ID",
    "Player 4 First Name", "Player 4 Last Name", "Player 4 Email", "Player 4 DUPR ID",
    "Game 1 Team 1 Score", "Game 1 Team 2 Score"
  ];

  const getPlayerDetails = (name) => {
    const p = state.players.find(x => x.name === name) || {};
    return {
      firstName: name,
      lastName: "",
      email: "",
      duprId: p.dupr || ""
    };
  };

  const rows = state.matches.map(m => {
    const p1 = getPlayerDetails(m.team1[0]);
    const p2 = getPlayerDetails(m.team1([dupr.zendesk.com](https://dupr.zendesk.com/hc/en-us/articles/45778582901140-Adding-Matches-via-CSV)));
    const p3 = getPlayerDetails(m.team2[0]);
    const p4 = getPlayerDetails(m.team2([dupr.zendesk.com](https://dupr.zendesk.com/hc/en-us/articles/45778582901140-Adding-Matches-via-CSV)));

    return [
      `"${m.date}"`,
      `"${p1.firstName}"`, `"${p1.lastName}"`, `"${p1.email}"`, `"${p1.duprId}"`,
      `"${p2.firstName}"`, `"${p2.lastName}"`, `"${p2.email}"`, `"${p2.duprId}"`,
      `"${p3.firstName}"`, `"${p3.lastName}"`, `"${p3.email}"`, `"${p3.duprId}"`,
      `"${p4.firstName}"`, `"${p4.lastName}"`, `"${p4.email}"`, `"${p4.duprId}"`,
      m.score1,
      m.score2
    ].join(',');
  });

  const csvContent = "\
