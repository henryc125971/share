<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>匹克球公平排場</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing:border-box; margin:0; padding:0; font-family:-apple-system,"Noto Sans TC",sans-serif; }
  body { background:#f0f4f8; color:#1a2b3c; padding:16px; max-width:720px; margin:0 auto; }
  h1 { font-size:1.4rem; text-align:center; margin-bottom:4px; }
  .sub { text-align:center; color:#667; font-size:.85rem; margin-bottom:16px; }
  .card { background:#fff; border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 2px 6px rgba(0,0,0,.08); }
  label { display:block; font-weight:600; margin:10px 0 4px; font-size:.9rem; }
  textarea, input, select { width:100%; padding:10px; border:1px solid #ccd; border-radius:8px; font-size:1rem; }
  button { padding:12px; margin-top:10px; border:none; border-radius:10px; background:#0a7d4f; color:#fff; font-size:1rem; font-weight:700; cursor:pointer; }
  button.gray { background:#5b6b7b; } button.red { background:#b23b3b; } button.blue { background:#1e6091; }
  .full { width:100%; }
  .court { border-left:6px solid #0a7d4f; }
  .court h3 { font-size:1rem; color:#0a7d4f; margin-bottom:8px; }
  .team { display:flex; justify-content:space-between; padding:5px 0; font-size:1.05rem; }
  .vs { text-align:center; color:#b23b3b; font-weight:700; margin:4px 0; font-size:.9rem; }
  .resting { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .tag { background:#e8eef4; padding:4px 10px; border-radius:20px; font-size:.85rem; }
  .rating-tag { font-size:.72rem; color:#0a7d4f; background:#e3f5ec; padding:2px 6px; border-radius:10px; margin-left:4px; }
  table { width:100%; border-collapse:collapse; font-size:.9rem; }
  th, td { padding:6px 8px; text-align:center; border-bottom:1px solid #e5eaf0; }
  th { background:#f5f8fb; }
  #qrbox { display:flex; justify-content:center; padding:10px; }
  .round { text-align:center; font-size:1.15rem; font-weight:700; margin-bottom:10px; }
  .btnrow { display:flex; gap:10px; margin-top:6px; } .btnrow button { flex:1; }
  .xbtn { background:none; color:#b23b3b; font-weight:700; padding:2px 6px; margin:0; font-size:.85rem; cursor:pointer; }
  .hint { font-size:.8rem; color:#789; text-align:center; margin-top:6px; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; justify-content:center; align-items:center; padding:16px; z-index:999; }
  .modal-content { background:#fff; border-radius:12px; padding:20px; width:100%; max-width:500px; max-height:85vh; overflow-y:auto; }
  .matchbox { margin-bottom:12px; padding:10px; background:#f9fafb; border-radius:8px; }
  .scoreline { display:flex; align-items:center; gap:8px; margin-top:6px; }
  .scoreline input { width:80px; text-align:center; font-size:1.1rem; font-weight:bold; }
  .result-line { font-size:.9rem; color:#333; margin-bottom:4px; }
</style>
</head>
<body>

<!-- ===== 設定頁 ===== -->
<div id="setup">
  <h1>匹克球公平排場</h1>
  <div class="sub">輸入人數與場地 · DUPR 分數整合 · 匯出 DUPR CSV</div>
  <div class="card">
    <label>球員名單（每行一位；格式「名字, DUPR分數」，沒有分數可只填名字）</label>
    <textarea id="names" rows="7" placeholder="王小明, 3.52&#10;李小華, 3.20&#10;John&#10;Mary, 4.01"></textarea>
    <label>場地數量</label>
    <select id="courts">
      <option value="1">1 面</option><option value="2" selected>2 面</option>
      <option value="3">3 面</option><option value="4">4 面</option>
      <option value="5">5 面</option><option value="6">6 面</option>
    </select>
    <button class="full" onclick="start()">開始排場</button>
  </div>
</div>

<!-- ===== 主持人畫面 ===== -->
<div id="game" style="display:none">
  <h1>匹克球公平排場</h1>
  <div class="sub" id="headerInfo"></div>
  <div class="round" id="roundTitle"></div>
  <div id="courtList"></div>
  <div class="card"><h3>本輪休息</h3><div class="resting" id="restList"></div></div>
  <div class="card" id="lastResultCard" style="display:none">
    <h3>上一輪結果</h3><div id="lastResult"></div>
  </div>
  <div class="card">
    <button class="full" onclick="openScoreModal()">結束本輪（輸入分數並排下一輪）</button>
    <div class="btnrow">
      <button class="gray" onclick="showQR()">顯示本輪 QR Code</button>
      <button class="gray" onclick="copyLink()">複製本輪連結</button>
    </div>
    <div id="qrbox"></div>
    <div class="hint">QR 每輪更新：重新安排後，請大家再掃一次</div>
  </div>
  <div class="card">
    <div style="display:flex; gap:8px;">
      <input id="newName" placeholder="球員名字" style="flex:2;">
      <input id="newDupr" placeholder="DUPR(選填)" type="number" step="0.01" style="flex:1;">
    </div>
    <button class="gray full" onclick="addPlayer()">加入球員（下一輪生效）</button>
  </div>
  <div class="card">
    <h3 style="margin-bottom:8px">公平統計（按 ✕ 讓球員離場）</h3>
    <table id="statsTable"></table>
    <button class="blue full" onclick="exportDUPRCSV()">匯出對戰結果 (DUPR CSV)</button>
    <button class="red full" onclick="resetAll()">全部重來</button>
  </div>
</div>

<!-- ===== 分數輸入 Modal ===== -->
<div id="scoreModal" class="modal-overlay">
  <div class="modal-content">
    <h2 style="font-size:1.2rem; margin-bottom:12px; text-align:center;">輸入第 <span id="mRoundNum"></span> 輪比分</h2>
    <div id="modalScores"></div>
    <div class="btnrow">
      <button class="gray" onclick="closeScoreModal()">取消</button>
      <button onclick="confirmRoundScores()">儲存並進入下一輪</button>
    </div>
  </div>
</div>

<!-- ===== 掃描者唯讀畫面 ===== -->
<div id="viewer" style="display:none">
  <h1>本輪對戰</h1>
  <div class="sub" id="vTitle"></div>
  <div id="vCourts"></div>
  <div class="card"><h3>休息中</h3><div class="resting" id="vRest"></div></div>
  <div class="card"><button class="gray full" onclick="location.hash='';location.reload()">回到大廳</button></div>
</div>

<script>
let state = null;
const $ = id => document.getElementById(id);
const KEY = 'pickleball_fair_state_v2';

/* ---------- 工具 ---------- */
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function show(id){ ['setup','game','viewer'].forEach(x => $(x).style.display = (x===id?'block':'none')); }

function parsePlayers(){
  return $('names').value.split('\n').map(s => s.trim()).filter(Boolean).map(line => {
    const parts = line.split(/[,，]/);
    const name = parts[0].trim();
    let dupr = parts[1] ? parseFloat(parts[1].trim()) : null;
    if (isNaN(dupr)) dupr = null;
    return { name, dupr, played:0, wins:0, losses:0, lastPlayed:0 };
  }).filter(p => p.name);
}

function findPlayer(name){ return state.players.find(p => p.name === name); }
function ratingTag(name){
  const p = findPlayer(name);
  return (p && p.dupr != null) ? '<span class="rating-tag">DUPR ' + p.dupr + '</span>' : '';
}

/* ---------- 開始 ---------- */
function start(){
  const players = parsePlayers();
  if (players.length < 5) { alert('至少需要 5 位球員才能輪替排場'); return; }
  let courts = parseInt($('courts').value);
  if (players.length < courts * 4 + 1) {
    courts = Math.max(1, Math.floor(players.length / 4));
    if (players.length - courts * 4 === 0 && players.length >= courts * 4 + 1) courts = courts;
    alert('球員不足 ' + courts * 4 + '+1 人，自動調整為 ' + courts + ' 面場地');
  }
  state = { players, courts, round: 0, assignment: null, matches: [], lastResults: [] };
  save(); nextRound(); show('game');
}

/* ---------- 公平排場 ---------- */
function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function nextRound(){
  const pool = shuffle([...state.players]).sort((a, b) => a.played - b.played || a.lastPlayed - b.lastPlayed);
  const slots = state.courts * 4;
  const usableCourts = Math.min(state.courts, Math.floor(pool.length / 4));
  const playing = pool.slice(0, usableCourts * 4);
  const resting = pool.slice(playing.length);

  const courts = [];
  for (let c = 0; c < usableCourts; c++) {
    const four = shuffle(playing.slice(c * 4, c * 4 + 4));
    courts.push({ a: [four[0].name, four[1].name], b: [four[2].name, four[3].name] });
  }
  state.round++;
  state.assignment = { courts, resting: resting.map(p => p.name) };
  playing.forEach(p => { p.played++; p.lastPlayed = state.round; });
  save(); render();
}

/* ---------- 畫面 ---------- */
function render(){
  $('headerInfo').textContent = '球員 ' + state.players.length + ' 人 · 場地 ' + state.assignment.courts.length + ' 面';
  $('roundTitle').textContent = '第 ' + state.round + ' 輪';

  $('courtList').innerHTML = state.assignment.courts.map((c, i) =>
    '<div class="card court"><h3>場地 ' + (i + 1) + '</h3>' +
    '<div class="team"><span>' + esc(c.a[0]) + ratingTag(c.a[0]) + '</span><span>' + esc(c.a[1]) + ratingTag(c.a[1]) + '</span></div>' +
    '<div class="vs">VS</div>' +
    '<div class="team"><span>' + esc(c.b[0]) + ratingTag(c.b[0]) + '</span><span>' + esc(c.b[1]) + ratingTag(c.b[1]) + '</span></div>' +
    '</div>').join('');

  $('restList').innerHTML = state.assignment.resting.length
    ? state.assignment.resting.map(n => '<span class="tag">' + esc(n) + ratingTag(n) + '</span>').join('')
    : '<span class="hint">無人休息</span>';

  if (state.lastResults.length) {
    $('lastResultCard').style.display = 'block';
    $('lastResult').innerHTML = state.lastResults.map(r =>
      '<div class="result-line">場地 ' + r.court + '：' + esc(r.team1.join(' & ')) +
      ' <b>' + r.score1 + ' : ' + r.score2 + '</b> ' + esc(r.team2.join(' & ')) + '</div>').join('');
  }

  $('statsTable').innerHTML =
    '<tr><th>球員</th><th>DUPR</th><th>上場</th><th>勝</th><th>敗</th><th></th></tr>' +
    state.players.map(p =>
      '<tr><td>' + esc(p.name) + '</td><td>' + (p.dupr != null ? p.dupr : '-') + '</td><td>' + p.played + '</td><td>' + p.wins + '</td><td>' + p.losses + '</td>' +
      '<td><button class="xbtn" onclick="leavePlayer(\'' + esc(p.name).replace(/'/g, "\\'") + '\')">✕</button></td></tr>').join('');
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------- 功能 1：結束本輪 → 輸入分數 ---------- */
function openScoreModal(){
  $('mRoundNum').textContent = state.round;
  $('modalScores').innerHTML = state.assignment.courts.map((c, i) =>
    '<div class="matchbox">' +
    '<div style="font-weight:bold; font-size:.9rem;">場地 ' + (i + 1) + '</div>' +
    '<div style="font-size:.85rem; color:#555;">A隊：' + esc(c.a.join(' & ')) + '</div>' +
    '<div style="font-size:.85rem; color:#555;">B隊：' + esc(c.b.join(' & ')) + '</div>' +
    '<div class="scoreline"><input type="number" id="mScoreA_' + i + '" min="0" placeholder="A分"><span>:</span><input type="number" id="mScoreB_' + i + '" min="0" placeholder="B分"></div>' +
    '</div>').join('');
  $('scoreModal').style.display = 'flex';
}
function closeScoreModal(){ $('scoreModal').style.display = 'none'; }

function confirmRoundScores(){
  const results = [];
  for (let i = 0; i < state.assignment.courts.length; i++) {
    const sa = $('mScoreA_' + i).value, sb = $('mScoreB_' + i).value;
    if (sa === '' || sb === '') { alert('請輸入場地 ' + (i + 1) + ' 的雙方分數'); return; }
    results.push({ court: i + 1, a: state.assignment.courts[i].a, b: state.assignment.courts[i].b, scoreA: parseInt(sa), scoreB: parseInt(sb) });
  }

  const today = new Date().toISOString().split('T')[0];
  state.lastResults = results.map(r => ({
    court: r.court, team1: [...r.a], team2: [...r.b],
    score1: Math.max(r.scoreA, r.scoreB), score2: Math.min(r.scoreA, r.scoreB)
  }));

  results.forEach(r => {
    const t1wins = r.scoreA > r.scoreB;
    state.matches.push({
      date: today, round: state.round, court: r.court,
      team1: [...r.a], team2: [...r.b],
      score1: Math.max(r.scoreA, r.scoreB), score2: Math.min(r.scoreA, r.scoreB)
    });
    [...r.a].forEach(n => { const p = findPlayer(n); if (p) { t1wins ? p.wins++ : p.losses++; } });
    [...r.b].forEach(n => { const p = findPlayer(n); if (p) { t1wins ? p.losses++ : p.wins++; } });
  });

  closeScoreModal();
  nextRound();
}

/* ---------- 功能 3：匯出 DUPR CSV ---------- */
function exportDUPRCSV(){
  if (!state.matches.length) { alert('目前尚無完成的對戰紀錄，請先在「結束本輪」時輸入比分'); return; }

  const csvEscape = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const headers = [
    'Match Date',
    'Player 1 First Name','Player 1 Last Name','Player 1 Email','Player 1 DUPR ID',
    'Player 2 First Name','Player 2 Last Name','Player 2 Email','Player 2 DUPR ID',
    'Player 3 First Name','Player 3 Last Name','Player 3 Email','Player 3 DUPR ID',
    'Player 4 First Name','Player 4 Last Name','Player 4 Email','Player 4 DUPR ID',
    'Game 1 Team 1 Score','Game 1 Team 2 Score'
  ];
  const cols = name => { const p = findPlayer(name) || {}; const seg = String(name).trim().split(/\s+/); return [seg[0] || name, seg.slice(1).join(' ') || '', p.email || '', p.dupr != null ? p.dupr : '']; };

  const rows = state.matches.map(m => {
    const p1 = cols(m.team1[0]), p2 = cols(m.team1[1]), p3 = cols(m.team2[0]), p4 = cols(m.team2[1]);
    return [csvEscape(m.date),
      ...p1.map(csvEscape), ...p2.map(csvEscape), ...p3.map(csvEscape), ...p4.map(csvEscape),
      m.score1, m.score2].join(',');
  });

  const blob = new Blob(['\ufeff' + headers.join(',') + '\n' + rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dupr_matches_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- 其他 ---------- */
function addPlayer(){
  const name = $('newName').value.trim();
  if (!name) return;
  if (findPlayer(name)) { alert('已有同名球員'); return; }
  let dupr = parseFloat($('newDupr').value);
  state.players.push({ name, dupr: isNaN(dupr) ? null : dupr, played:0, wins:0, losses:0, lastPlayed:0 });
  $('newName').value = ''; $('newDupr').value = '';
  save(); render(); alert('已加入，下一輪會自動排入');
}

function leavePlayer(name){
  if (!confirm('確定讓「' + name + '」離場？')) return;
  state.players = state.players.filter(p => p.name !== name);
  state.assignment.courts.forEach(c => { c.a = c.a.filter(n => n !== name); c.b = c.b.filter(n => n !== name); });
  state.assignment.resting = state.assignment.resting.filter(n => n !== name);
  save(); render();
}

function viewURL(){
  return location.origin + location.pathname + '#v=' + encodeURIComponent(JSON.stringify({
    round: state.round, courts: state.assignment.courts, resting: state.assignment.resting
  }));
}
function showQR(){
  $('qrbox').innerHTML = '';
  new QRCode($('qrbox'), { text: viewURL(), width: 180, height: 180 });
}
function copyLink(){
  navigator.clipboard.writeText(viewURL()).then(() => alert('已複製本輪連結'));
}
function resetAll(){
  if (!confirm('確定全部重來？所有紀錄會清除')) return;
  localStorage.removeItem(KEY); location.reload
