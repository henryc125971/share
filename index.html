<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>匹克球 Open Play 湊隊</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f4;--card:#fff;--tx:#1b2418;--mu:#6b7566;--ac:#3f8f2f;--ac2:#e8f3e4;--bd:#dde2d8;--wn:#c0562b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141813;--card:#1e251c;--tx:#eaf0e6;--mu:#98a392;--ac:#6cc455;--ac2:#243322;--bd:#2f3a2c;--wn:#e8825a}}
:root[data-theme="dark"]{--bg:#141813;--card:#1e251c;--tx:#eaf0e6;--mu:#98a392;--ac:#6cc455;--ac2:#243322;--bd:#2f3a2c;--wn:#e8825a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC",sans-serif;padding:12px;max-width:640px;margin:auto}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
input,textarea,select{width:100%;box-sizing:border-box;font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
textarea{min-height:120px;font-size:14px}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:var(--ac2);color:var(--tx);border:1px solid var(--bd)}button.w{background:var(--wn)}
button:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.team{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0}
.team b{flex:1}.sc{width:56px!important;text-align:center}
.win{color:var(--ac);font-weight:700}.mu{color:var(--mu);font-size:13px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:5px 6px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}td:nth-child(2),th:nth-child(2){text-align:left}
#qr svg{width:180px;height:180px}
</style></head><body>
<h1>🥒 匹克球 Open Play 湊隊</h1>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
var S=null,KEY='pb-openplay-v1',tab='play';
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
var DB=null,IS_ED=true,LIVE,pt=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}pushLive()}
function pushLive(){
 if(!DB||!IS_ED)return;clearTimeout(pt);
 pt=setTimeout(function(){
  var pub=null;
  if(S){var R=S.rounds[S.rounds.length-1],nm=function(t){return t.map(function(i){return S.players[i].name})};
   pub={mode:MODES[S.mode],ended:S.ended,ri:S.rounds.length,
    matches:R.matches.map(function(m){return{c:m.c,a:nm(m.a),b:nm(m.b),sa:m.sa,sb:m.sb,w:m.w}}),
    bench:R.bench.map(function(i){return S.players[i].name}),
    names:S.players.map(function(p){return p.name}),
    st:S.players.slice().sort(function(a,b){return b.w-a.w||b.pd-a.pd||a.g-b.g}).map(function(p){return{n:p.name,g:p.g,w:p.w,l:p.l,pd:p.pd}})}}
  try{DB.doc('live/state').set({j:JSON.stringify(pub),t:Date.now()}).catch(function(){})}catch(e){}
 },700)}
function setMe(v){try{localStorage.setItem('pb-me',v)}catch(e){}render()}
function vrender(){
 var L=LIVE;
 if(L===undefined)return $('app').innerHTML='<div class="card mu">連線中…</div>';
 if(!L)return $('app').innerHTML='<div class="card">主辦人尚未開局，開局後這裡會即時更新。</div>';
 var me='';try{me=localStorage.getItem('pb-me')||''}catch(e){}
 var h='<div class="card"><b>第 '+L.ri+' 輪'+(L.ended?'．已結束':'')+'</b><div class="mu">'+esc(L.mode)+'</div><label>我是</label><select onchange="setMe(this.value)"><option value="">選擇你的名字</option>'+
  L.names.map(function(n){return'<option'+(n===me?' selected':'')+'>'+esc(n)+'</option>'}).join('')+'</select>';
 if(me&&!L.ended){var pos=L.bench.indexOf(me)>=0?'本輪休息，請稍候':'';
  L.matches.forEach(function(m){if(m.a.concat(m.b).indexOf(me)>=0)pos='請到場地 '+m.c});
  h+='<div class="win" style="margin-top:8px;font-size:20px">'+esc(pos)+'</div>'}
 h+='</div>';
 var T=function(t,sc,w){var b=t.map(function(n){return n===me?'<u>'+esc(n)+'</u>':esc(n)}).join(' ＋ ');return'<div class="team"><b class="'+(w?'win':'')+'">'+(w?'🏆 ':'')+b+'</b><span>'+(sc===''?'':sc)+'</span></div>'};
 L.matches.forEach(function(m){h+='<div class="card"><h2>場地 '+m.c+'</h2>'+T(m.a,m.sa,m.w==='a')+'<div class="mu" style="text-align:center">VS</div>'+T(m.b,m.sb,m.w==='b')+'</div>'});
 h+='<div class="card"><b>休息中：</b>'+(L.bench.length?L.bench.map(esc).join('、'):'無')+'</div>';
 h+='<div class="card tw"><h2>排名</h2><table><tr><th>#</th><th>球員</th><th>場數</th><th>勝</th><th>負</th><th>分差</th></tr>'+
  L.st.map(function(p,i){return'<tr><td>'+(i+1)+'</td><td>'+esc(p.n)+'</td><td>'+p.g+'</td><td>'+p.w+'</td><td>'+p.l+'</td><td>'+p.pd+'</td></tr>'}).join('')+'</table></div>';
 $('app').innerHTML=h}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function $(i){return document.getElementById(i)}
var MODES={fair:'一般隨機（公平上場）',rank:'輸贏分強弱（贏家往高場）',dupr:'DUPR 實力配對'};

function setup(){
 var n=(S&&S.draftN)||12;
 $('app').innerHTML='<div class="card"><h2>開局設定</h2>'+
 '<div class="row"><div><label>人數</label><input id="n" type="number" min="4" value="'+n+'" onchange="fillNames()"></div>'+
 '<div><label>場地數</label><input id="c" type="number" min="1" value="3"></div></div>'+
 '<label>連續上場上限（輪，0＝不限；達到上限會優先輪休）</label><input id="mx" type="number" min="0" value="3">'+
 '<label>模式</label><select id="m">'+Object.keys(MODES).map(function(k){return'<option value="'+k+'">'+MODES[k]+'</option>'}).join('')+'</select>'+
 '<label>球員名單（每行：名字, DUPR評分, DUPR ID；後兩項選填，DUPR 模式需評分）</label>'+
 '<textarea id="p"></textarea><div id="msg" style="color:var(--wn);font-size:14px;margin-top:8px"></div><br><div class="row"><button onclick="start()">開始</button><button class="g" onclick="showQR()">QR Code</button></div>'+
 '<div id="qr" style="text-align:center;margin-top:10px"></div></div>';
 fillNames();
}
function fillNames(){
 var n=+$('n').value||4,L=$('p').value.split('\n').filter(function(x){return x.trim()});
 while(L.length<n)L.push('玩家'+(L.length+1));
 $('p').value=L.slice(0,n).join('\n');
}
function showQR(id){
 id=id||'qr';
 try{var q=qrcode(0,'M');q.addData(location.href);q.make();$(id).innerHTML=q.createSvgTag(4)+'<div class="mu">球員掃描即可即時查看對戰表（需能開啟此頁）</div>'}catch(e){$(id).textContent='QR 產生失敗'}
}
function start(){
 var m=$('m').value,P=$('p').value.split('\n').filter(function(x){return x.trim()}).map(function(l,i){
  var a=l.split(/[,，]/).map(function(x){return x.trim()});
  return{id:i,name:a[0],r:parseFloat(a[1])||0,duprId:a[2]||'',g:0,w:0,l:0,pd:0,last:-1,st:0,away:false,pa:{},op:{}}});
 if(P.length<4)return msg('至少需要 4 位球員');
 if(m==='dupr'&&P.some(function(p){return!p.r}))return msg('DUPR 模式需要每位球員的評分。請在名單每行填入，例如：小明, 3.45, DUPR ID（目前缺：'+P.filter(function(p){return!p.r}).map(function(p){return p.name}).join('、')+'）');
 S={maxStreak:+$('mx').value||0,mode:m,courts:Math.max(1,+$('c').value||1),players:P,rounds:[],ended:false};
 S.rounds.push(gen());save();render();
}
var CF='';
function msg(t){var e=$('msg');if(e){e.textContent=t;e.scrollIntoView({block:'nearest'})}}
function ask(k,fn){if(CF===k){CF='';fn()}else{CF=k;render();setTimeout(function(){if(CF===k){CF='';render()}},4000)}}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function P(id){return S.players[id]}
function cnt(o,k){return o[k]||0}
function pairCost(a,b){ // a,b: arrays of 2 ids
 var c=cnt(P(a[0]).pa,a[1])*10+cnt(P(b[0]).pa,b[1])*10;
 a.forEach(function(x){b.forEach(function(y){c+=cnt(P(x).op,y)*3})});
 if(S.mode==='dupr'){var d=Math.abs(P(a[0]).r+P(a[1]).r-P(b[0]).r-P(b[1]).r);c+=d*15}
 return c}
function best4(q){ // choose best pairing of 4 ids
 var o=[[[q[0],q[1]],[q[2],q[3]]],[[q[0],q[2]],[q[1],q[3]]],[[q[0],q[3]],[q[1],q[2]]]],b=null,bc=1e9;
 o.forEach(function(x,i){var c=pairCost(x[0],x[1])+(S.mode==='rank'&&i===2?-0.5:0);if(c<bc){bc=c;b=x}});
 return{a:b[0],b:b[1],c:bc}}
function gen(){
 var el=S.players.filter(function(p){return!p.away}),aw=S.players.filter(function(p){return p.away}).map(function(p){return p.id}),mx=S.maxStreak||0;
 var nc=Math.min(S.courts,Math.floor(el.length/4)),slots=nc*4;
 var ov=function(p){return mx>0&&(p.st||0)>=mx?1:0};
 var pool=el.map(function(p){return{p:p,k:Math.random()}}).sort(function(x,y){return ov(x.p)-ov(y.p)||x.p.g-y.p.g||x.p.last-y.p.last||x.k-y.k}).map(function(x){return x.p});
 var act=pool.slice(0,slots).map(function(p){return p.id}),bench=pool.slice(slots).map(function(p){return p.id}).concat(aw),ms=[];
 if(S.mode==='fair'){
  var bestC=1e9,bm=null;
  for(var t=0;t<150;t++){var sh=shuffle(act),tot=0,cur=[];
   for(var i=0;i<nc;i++){var r=best4(sh.slice(i*4,i*4+4));tot+=r.c;cur.push(r)}
   if(tot<bestC){bestC=tot;bm=cur}}
  ms=bm||[];
 }else{
  var key=function(id){var p=P(id);return S.mode==='dupr'?p.r+Math.random()*0.001:p.w*3+p.pd/10+Math.random()*0.5};
  act.sort(function(a,b){return key(b)-key(a)});
  for(var i=0;i<nc;i++)ms.push(best4(act.slice(i*4,i*4+4)));
 }
 return{matches:ms.map(function(m,i){return{c:i+1,a:m.a,b:m.b,sa:'',sb:'',w:''}}),bench:bench};
}
function setScore(r,m,side,v){
 var x=S.rounds[r].matches[m];x[side]=v===''?'':+v;
 if(x.sa!==''&&x.sb!==''&&x.sa!==x.sb)x.w=x.sa>x.sb?'a':'b';else if(x.sa===x.sb)x.w='';
 save();render();}
function setWin(r,m,w){var x=S.rounds[r].matches[m];x.w=w;save();render()}
function roundDone(r){return S.rounds[r].matches.every(function(m){
 return m.w&&(S.mode!=='dupr'||(m.sa!==''&&m.sb!==''))})}
function apply(r){
 var ri=r;S.rounds[r].matches.forEach(function(m){
  var all=m.a.concat(m.b),d=(m.sa!==''&&m.sb!=='')?Math.abs(m.sa-m.sb):0;
  all.forEach(function(id){P(id).g++;P(id).st=(P(id).st||0)+1;P(id).last=ri});
  [m.a,m.b].forEach(function(t,ti){
   var won=(ti===0)===(m.w==='a');
   t.forEach(function(id){var p=P(id);won?p.w++:p.l++;p.pd+=won?d:-d});
   P(t[0]).pa[t[1]]=cnt(P(t[0]).pa,t[1])+1;P(t[1]).pa[t[0]]=cnt(P(t[1]).pa,t[0])+1});
  m.a.forEach(function(x){m.b.forEach(function(y){P(x).op[y]=cnt(P(x).op,y)+1;P(y).op[x]=cnt(P(y).op,x)+1})});
 });
 S.players.forEach(function(p){if(p.last!==ri)p.st=0});}
function toggleAway(id){
 P(id).away=!P(id).away;var R=S.rounds[S.rounds.length-1];
 if(R.matches.every(function(m){return!m.w&&m.sa===''&&m.sb===''}))S.rounds[S.rounds.length-1]=gen();
 save();render()}
function next(){var r=S.rounds.length-1;apply(r);S.rounds.push(gen());save();render()}
function finish(){ask('fin',function(){apply(S.rounds.length-1);S.ended=true;save();render()})}
function reset(){ask('rst',function(){S=null;try{localStorage.removeItem(KEY)}catch(e){}pushLive();render()})}
function expv(){if(!S.exp)S.exp={event:'Open Play',loc:'',date:new Date().toISOString().slice(0,10),mt:'SIDE_ONLY',st:''};return S.exp}
var HDR=['matchType','event','date','playerA1','playerA1DuprId','playerA1ExternalId','playerA2','playerA2DuprId','playerA2ExternalId','playerB1','playerB1DuprId','playerB1ExternalId','playerB2','playerB2DuprId','playerB2ExternalId','teamAGame1','teamBGame1','teamAGame2','teamBGame2','teamAGame3','teamBGame3','teamAGame4','teamBGame4','teamAGame5','teamBGame5','location','scoreType'];
function csv(){
 var e=expv(),rows=[HDR];
 S.rounds.forEach(function(r){r.matches.forEach(function(m){
  if(!m.w||m.sa===''||m.sb==='')return;
  var f=function(id){return[P(id).name,P(id).duprId,'']};
  rows.push([e.mt,e.event,e.date].concat(f(m.a[0]),f(m.a[1]),f(m.b[0]),f(m.b[1]),[m.sa,m.sb,'','','','','','','','',e.loc,e.st]))})});
 return rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n')}
function skipped(){var n=0;S.rounds.forEach(function(r){r.matches.forEach(function(m){if(m.w&&(m.sa===''||m.sb===''))n++})});return n}
function noId(){return S.players.filter(function(p){return!p.duprId}).map(function(p){return esc(p.name)})}
function ex(k,v){expv()[k]=v;save();$('csv').value=csv()}
function expForm(){
 var e=expv(),I=function(k,l){return'<label>'+l+'</label><input value="'+esc(e[k])+'" oninput="ex(\''+k+'\',this.value)">'};
 var w='',sk=skipped(),mi=noId();
 if(sk)w+='<div class="mu" style="color:var(--wn)">⚠ '+sk+' 場只選了勝隊、沒有比分，未列入 CSV（DUPR 需要比分）。</div>';
 if(mi.length)w+='<div class="mu" style="color:var(--wn)">⚠ 缺少 DUPR ID：'+mi.join('、')+'。上傳時 DUPR 會要求你手動比對這些球員。</div>';
 return I('event','活動名稱 event')+I('date','日期 date（yyyy-MM-dd）')+I('loc','地點 location')+I('mt','matchType')+I('st','scoreType（請對照 DUPR 範本填寫）')+w}
function copyCsv(){var t=$('csv'),ok=false;t.focus();t.select();try{ok=document.execCommand('copy')}catch(e){}if(!ok){try{navigator.clipboard.writeText(t.value);ok=true}catch(e){}}$('cm').textContent=ok?'已複製 ✔':'無法自動複製，請長按上方文字框手動全選複製'}
function nm(t){return t.map(function(id){return esc(P(id).name)}).join(' ＋ ')}
function stand(){
 var L=S.players.slice().sort(function(a,b){return b.w-a.w||b.pd-a.pd||a.g-b.g});
 return'<div class="card tw"><h2>排名 / 上場統計</h2><table><tr><th>#</th><th>球員</th><th>場數</th><th>勝</th><th>負</th><th>分差</th>'+(S.ended?'':'<th>休息</th>')+'</tr>'+
 L.map(function(p,i){return'<tr><td>'+(i+1)+'</td><td>'+esc(p.name)+'</td><td>'+p.g+'</td><td>'+p.w+'</td><td>'+p.l+'</td><td>'+p.pd+'</td>'+(S.ended?'':'<td><button class="'+(p.away?'w':'g')+'" style="padding:3px 8px" onclick="toggleAway('+p.id+')">'+(p.away?'歸隊':'暫離')+'</button></td>')+'</tr>'}).join('')+'</table></div>'}
function render(){
 if(!IS_ED)return vrender();
 if(!S)return setup();
 var ri=S.rounds.length-1,R=S.rounds[ri],h='';
 if(S.ended){
  h='<div class="card"><h2>🏁 比賽結束（共 '+S.rounds.length+' 輪）</h2><div class="mu">已照 DUPR「Import Matches」範本的 27 欄格式輸出。</div>'+expForm()+'<br><textarea id="csv" readonly>'+esc(csv())+'</textarea><br><br><div class="mu">上傳：DUPR 網站 → 你的 Club → Matches → Import Matches via CSV（需為 Club 管理者）。</div><br><div class="row"><button onclick="copyCsv()">複製紀錄</button><button class="w" onclick="reset()">'+(CF==='rst'?'再按一次確認':'重新開局')+'</button></div><div id="cm" class="mu"></div></div>'+stand();
  $('app').innerHTML=h;return;
 }
 h='<div class="card"><div class="row"><div><b>第 '+(ri+1)+' 輪</b><div class="mu">'+MODES[S.mode]+'</div></div><button class="g" onclick="showQR(\'qr2\')">球員QR</button><button class="g" onclick="tab=tab===\'play\'?\'rank\':\'play\';render()">'+(tab==='play'?'看排名':'回對戰')+'</button></div><div id="qr2" style="text-align:center"></div></div>';
 if(tab==='rank')h+=stand();
 else{
  if(!R.matches.length)h+='<div class="card">目前可上場人數不足 4 人，請到「看排名」讓暫離球員歸隊。</div>';
  R.matches.forEach(function(m,i){
   var T=function(side,t){var w=m.w===side;return'<div class="team"><b class="'+(w?'win':'')+'">'+(w?'🏆 ':'')+nm(t)+'</b>'+
    '<input class="sc" type="number" min="0" inputmode="numeric" placeholder="分" value="'+m['s'+side]+'" onchange="setScore('+ri+','+i+',\'s'+side+'\',this.value)">'+
    (S.mode==='dupr'?'':'<button class="g" onclick="setWin('+ri+','+i+',\''+side+'\')">勝</button>')+'</div>'};
   h+='<div class="card"><h2>場地 '+m.c+'</h2>'+T('a',m.a)+'<div class="mu" style="text-align:center">VS</div>'+T('b',m.b)+'</div>';
  });
  h+='<div class="card"><b>休息中：</b>'+(R.bench.length?R.bench.map(function(id){return esc(P(id).name)+(P(id).away?'（暫離）':'')}).join('、'):'無')+'</div>';
 }
 var ok=roundDone(ri);
 h+='<div class="row"><button onclick="next()" '+(ok?'':'disabled')+'>下一輪</button><button class="w" onclick="finish()" '+(ok?'':'disabled')+'>'+(CF==='fin'?'再按一次確認結束':'結束比賽')+'</button></div>'+
 (ok?'':'<div class="mu" style="margin-top:6px">'+(S.mode==='dupr'?'請輸入所有場地比分':'請選出所有場地的勝隊')+'後才能繼續</div>')+
 '<div style="margin-top:12px"><button class="g" onclick="reset()">'+(CF==='rst'?'再按一次確認重設':'重設')+'</button></div>';
 $('app').innerHTML=h;
}
(async function(){
 var c=window.claude;
 if(!c||!c.use){render();return}
 $('app').innerHTML='<div class="card mu">載入中…</div>';
 try{var u=await c.use('user');DB=await c.use('db');IS_ED=u?await u.canEdit():false}catch(e){IS_ED=false}
 if(!IS_ED){
  if(DB){try{DB.doc('live/state').onSnapshot(function(s){LIVE=s.exists?JSON.parse(s.data().j):null;vrender()},function(){LIVE=null;vrender()})}catch(e){LIVE=null}}
  else LIVE=null;
 }
 render();if(IS_ED&&S)pushLive();
})();
</script></body></html>
